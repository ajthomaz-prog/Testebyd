name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Print env
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Gradle dependencies
        run: ./gradlew :app:dependencies --no-daemon --stacktrace 2>&1 | tee dependencies.log

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --info 2>&1 | tee unit-tests.log

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee assemble-debug.log

      - name: Build release APK (debug-signed fallback)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --info 2>&1 | tee assemble-release.log

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/byd-briefing-debug.apk 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/byd-briefing-release.apk 2>/dev/null || true
          ls -la out/ || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            dependencies.log
            unit-tests.log
            assemble-debug.log
            assemble-release.log
          if-no-files-found: warn

      - name: Upload APKs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byd-briefing-apks
          path: out/*.apk
          if-no-files-found: warn

      - name: Publish release (rolling 'latest-build' tag)
        if: success() && github.ref == 'refs/heads/claude/android-news-audio-app-wIysa'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "BYD Briefing — latest build"
          prerelease: true
          body: |
            APK gerado automaticamente pelo CI a partir do commit ${{ github.sha }}.

            **Downloads diretos** (sempre apontam para o build mais recente):
            - [byd-briefing-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest-build/byd-briefing-debug.apk) — assinado com chave de debug, ideal para sideload de teste.
            - [byd-briefing-release.apk](https://github.com/${{ github.repository }}/releases/download/latest-build/byd-briefing-release.apk) — release (assinado com chave debug enquanto não houver keystore configurado).

            Sideload no BYD Song Premium: pendrive FAT32 → pasta `third party apps` → senha `20211231`.
          files: |
            out/byd-briefing-debug.apk
            out/byd-briefing-release.apk
